<!doctype html>
<html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#030303"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml">
<title>VOID — Material Experience / 002</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#030303;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:#e6e5e2}button{font:inherit}#world{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}#intro{position:fixed;inset:0;background:#020202;display:grid;place-items:center;z-index:6;transition:opacity 1.25s ease,visibility 1.25s}#intro.off{opacity:0;visibility:hidden;pointer-events:none}.enter{position:relative;border:none;background:transparent;color:#ededeb;padding:30px 34px;font-size:13px;font-weight:400;letter-spacing:.56em;text-indent:.56em;cursor:pointer}.enter:after{content:"";position:absolute;left:50%;bottom:20px;width:28px;height:1px;background:#777;transform:translateX(-50%);transition:width .7s}.enter:active:after{width:110px}.intro-meta{position:absolute;left:0;right:0;bottom:calc(48px + env(safe-area-inset-bottom));font:9px ui-monospace,monospace;letter-spacing:.22em;text-align:center;color:#545454}.ui{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 1.5s;z-index:3}.ui.show{opacity:1}.head{position:absolute;left:28px;right:28px;top:calc(29px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;font:10px ui-monospace,monospace;letter-spacing:.18em;color:#a1a19f}.head span:last-child{color:#666}.foot{position:absolute;bottom:calc(30px + env(safe-area-inset-bottom));left:28px;right:28px;display:flex;justify-content:space-between;align-items:end;gap:22px}.phase{font-size:clamp(28px,8vw,43px);font-weight:200;letter-spacing:-.055em;line-height:.95}.phase-meta{font:9px ui-monospace,monospace;letter-spacing:.12em;color:#8d8b87;margin-top:13px}.index{font:10px ui-monospace,monospace;letter-spacing:.13em;color:#777;white-space:nowrap}.side{position:absolute;right:24px;top:50%;transform:translateY(-50%);writing-mode:vertical-rl;font:9px ui-monospace,monospace;letter-spacing:.23em;color:#777}.progress{position:absolute;left:28px;right:28px;bottom:calc(14px + env(safe-area-inset-bottom));height:1px;background:#2c2c2c}.progress i{display:block;width:33.333%;height:1px;background:#dedbd6;transition:transform 750ms cubic-bezier(.2,.75,.2,1)}#motion{position:fixed;z-index:5;left:50%;bottom:calc(112px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111c;color:#ddd;border:1px solid #555;padding:11px 16px;letter-spacing:.12em;font-size:9px;white-space:nowrap;display:none}#motion.show{display:block}#camera{position:fixed;z-index:5;right:27px;top:calc(62px + env(safe-area-inset-top));border:1px solid #555;background:rgba(5,5,5,.72);color:#d6d4d0;padding:10px 12px;letter-spacing:.12em;font:9px ui-monospace,monospace;cursor:pointer}#camera.active{border-color:#aaa;color:#fff}#camera:disabled{opacity:.45}#lightmeter{position:fixed;z-index:5;right:27px;top:calc(109px + env(safe-area-inset-top));width:110px;pointer-events:none;display:none}#lightmeter.show{display:block}#lightmeter .reading{font:10px ui-monospace,monospace;color:#ccc;letter-spacing:.08em;display:flex;justify-content:space-between;margin-bottom:6px}#lightmeter .track{height:2px;background:#454545}#lightmeter .fill{height:100%;width:0;background:#e0dcd5;transition:width .2s linear}#prompt{position:fixed;z-index:4;left:50%;top:55%;transform:translate(-50%,-50%);pointer-events:none;font:9px ui-monospace,monospace;letter-spacing:.3em;white-space:nowrap;color:#e9e5e0;opacity:0;transition:opacity .35s;text-shadow:0 1px 14px black}#prompt.show{opacity:.85}@media(max-width:360px){.head{left:20px;right:20px}.foot{left:20px;right:20px}.side{right:15px}}@media(prefers-reduced-motion:reduce){#intro,.ui,#prompt,.progress i{transition:none}}
</style></head><body>
<canvas id="world" aria-label="Superficie digitale reattiva"></canvas>
<section id="intro"><button class="enter" id="enter">ENTRA</button><div class="intro-meta">VOID &nbsp; / &nbsp; AN INTERACTIVE STUDY &nbsp; 002</div></section>
<div class="ui" id="ui"><div class="head"><span>VOID — 002</span><span id="sensor">MATERIAL / LIVE</span></div><div class="side">TOUCH · HOLD · SWIPE · TILT</div><div class="foot"><div><div class="phase" id="phase">Aether</div><div class="phase-meta" id="descriptor">01 / ATMOSPHERE</div></div><div class="index" id="index">01 — 03</div></div><div class="progress"><i id="bar"></i></div></div>
<div id="prompt" role="status" aria-live="polite"></div><button id="motion">ABILITA MOVIMENTO</button><button id="camera" aria-pressed="false" title="La fotocamera modula la luce e crea uno sfondo astratto, senza salvare immagini">CAMERA / OFF</button><div id="lightmeter" aria-live="off"><div class="reading"><span>LIGHT</span><span id="lightvalue">--%</span></div><div class="track"><div class="fill" id="lightfill"></div></div></div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),canvas=$('world'),ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});if(!ctx)return;
const names=['Aether','Lattice','Monolith'],labels=['ATMOSPHERE','PARTICLE FIELD','SCULPTED MATTER'];
let w=1,h=1,dpr=1,run=false,scene=0,form=0,time=0,last=0,energy=0,pulse=0,depth=0,drag={x:0,y:0},tilt={x:0,y:0},target={x:0,y:0},point={x:.5,y:.5},down=null,holding=false,holdTimer=0,motionActive=false,messageTimer=0,raf=0;
let noiseCanvas=document.createElement('canvas'),grain=noiseCanvas.getContext('2d');
let reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
// The experience rests after twenty seconds without touch, independent of camera and motion.
const IDLE_FADE_MS=20000;let lastTouch=performance.now(),idleBlack=0;
function markInteraction(){lastTouch=performance.now()}

const cameraVideo=document.createElement('video');cameraVideo.muted=true;cameraVideo.playsInline=true;cameraVideo.setAttribute('playsinline','');const cameraCanvas=document.createElement('canvas');cameraCanvas.width=48;cameraCanvas.height=72;const cameraCtx=cameraCanvas.getContext('2d',{willReadFrequently:true});let cameraStream=null,cameraActive=false,cameraBusy=false,cameraLight=.5,filteredLight=.5,lastCameraSample=0,cameraSamples=0,cameraError=false,lightLow=1,lightHigh=0;
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function lerp(a,b,s){return a+(b-a)*s}
function resize(){w=window.innerWidth;h=window.innerHeight;dpr=Math.min(devicePixelRatio||1,Math.max(1,Math.sqrt(1700000/(w*h))));canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);noiseCanvas.width=192;noiseCanvas.height=336;const img=grain.createImageData(192,336);for(let i=0;i<img.data.length;i+=4){const v=Math.floor(Math.random()*255);img.data[i]=v;img.data[i+1]=v;img.data[i+2]=v;img.data[i+3]=Math.floor(Math.random()*92)}grain.putImageData(img,0,0)}
window.addEventListener('resize',resize,{passive:true});resize();
function announce(s){$('prompt').textContent=s;$('prompt').classList.add('show');clearTimeout(messageTimer);messageTimer=setTimeout(()=>$('prompt').classList.remove('show'),850)}
function choose(n){markInteraction();scene=(n+3)%3;$('phase').textContent=names[scene];$('descriptor').textContent='0'+(scene+1)+' / '+labels[scene];$('index').textContent='0'+(scene+1)+' — 03';$('bar').style.transform='translateX('+(scene*100)+'%)';pulse=1;announce(names[scene].toUpperCase())}
function orientation(e){if(e.gamma==null||e.beta==null)return;target.x=clamp(e.gamma/32,-1,1);target.y=clamp((e.beta-35)/46,-1,1);$('sensor').textContent='MOTION / ACTIVE'}
async function motion(){markInteraction();try{if(!window.DeviceOrientationEvent){$('sensor').textContent='MOTION / UNAVAILABLE';return}if(typeof DeviceOrientationEvent.requestPermission==='function'){let r=await DeviceOrientationEvent.requestPermission();if(r!=='granted'){$('sensor').textContent='MOTION / OFF';return}}window.addEventListener('deviceorientation',orientation,{passive:true});motionActive=true;$('motion').classList.remove('show')}catch{$('sensor').textContent='MOTION / UNAVAILABLE'}}
$('motion').addEventListener('click',motion);
function stopCamera(){markInteraction();cameraActive=false;if(cameraStream){cameraStream.getTracks().forEach(track=>track.stop());cameraStream=null}cameraVideo.pause();cameraVideo.srcObject=null;$('camera').classList.remove('active');$('camera').setAttribute('aria-pressed','false');$('camera').textContent='CAMERA / OFF';$('sensor').textContent='MATERIAL / LIVE';cameraLight=.5;cameraSamples=0;lightLow=1;lightHigh=0;$('lightmeter').classList.remove('show')}
async function toggleCamera(){markInteraction();if(cameraBusy)return;if(cameraActive){stopCamera();announce('CAMERA / OFF');return}if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){announce('CAMERA UNAVAILABLE');return}cameraBusy=true;$('camera').disabled=true;let pending=null;try{pending=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:320},height:{ideal:240},frameRate:{ideal:10,max:15}}});cameraStream=pending;cameraVideo.srcObject=pending;await cameraVideo.play();cameraActive=true;lastCameraSample=0;cameraSamples=0;cameraError=false;lightLow=1;lightHigh=0;filteredLight=.5;$('lightmeter').classList.add('show');$('lightvalue').textContent='...';$('camera').classList.add('active');$('camera').textContent='CAMERA / ON';$('camera').setAttribute('aria-pressed','true');$('sensor').textContent='LIGHT / LIVE';announce('LIGHT SENSING')}catch(e){if(pending)pending.getTracks().forEach(t=>t.stop());cameraStream=null;cameraVideo.srcObject=null;announce(e&&e.name==='NotAllowedError'?'CAMERA DENIED':'CAMERA UNAVAILABLE')}finally{cameraBusy=false;$('camera').disabled=false}}
$('camera').addEventListener('click',toggleCamera);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&cameraActive)stopCamera()});
function sampleCamera(now){if(!cameraActive||!cameraCtx||now-lastCameraSample<130)return;lastCameraSample=now;if(cameraVideo.readyState<2)return;try{const vw=cameraVideo.videoWidth||320,vh=cameraVideo.videoHeight||240,ratio=Math.max(48/vw,72/vh),cw=48/ratio,ch=72/ratio;cameraCtx.drawImage(cameraVideo,(vw-cw)/2,(vh-ch)/2,cw,ch,0,0,48,72);const pixels=cameraCtx.getImageData(0,0,48,72).data;let sum=0;for(let i=0;i<pixels.length;i+=4){const r=pixels[i]/255,g=pixels[i+1]/255,b=pixels[i+2]/255;sum+=.2126*r*r+.7152*g*g+.0722*b*b}cameraLight=clamp(Math.sqrt(sum/(pixels.length/4)),0,1);cameraSamples++;lightLow=Math.min(cameraLight,lightLow);lightHigh=Math.max(cameraLight,lightHigh);$('lightvalue').textContent=Math.round(cameraLight*100)+'%';$('lightfill').style.width=Math.round(cameraLight*100)+'%';$('sensor').textContent='LIGHT / '+Math.round(cameraLight*100)+'%';cameraError=false}catch(e){if(!cameraError){cameraError=true;$('lightvalue').textContent='ERR';announce('LIGHT SENSOR ERROR')}}}
$('enter').addEventListener('click',()=>{run=true;markInteraction();idleBlack=0;$('intro').classList.add('off');$('ui').classList.add('show');if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function')$('motion').classList.add('show');else motion();if(!raf)raf=requestAnimationFrame(frame)});
canvas.addEventListener('pointerdown',e=>{if(!run)return;markInteraction();point={x:e.clientX/w,y:e.clientY/h};down={x:e.clientX,y:e.clientY,t:performance.now()};holding=false;clearTimeout(holdTimer);holdTimer=setTimeout(()=>{holding=true;announce('HOLD / GRAVITY')},440);try{canvas.setPointerCapture(e.pointerId)}catch{}});
canvas.addEventListener('pointermove',e=>{if(!run)return;point={x:e.clientX/w,y:e.clientY/h};if(down){markInteraction();const dx=e.clientX-down.x,dy=e.clientY-down.y;if(Math.hypot(dx,dy)>16){clearTimeout(holdTimer);if(!holding){drag.x=clamp(dx/w,-1,1);drag.y=clamp(dy/h,-1,1)}}}});
function end(e){if(!down)return;markInteraction();clearTimeout(holdTimer);let dx=e.clientX-down.x,dy=e.clientY-down.y,d=Math.hypot(dx,dy);down=null;if(holding){holding=false;pulse=1.7;energy=1.25;announce('RELEASE');return}if(d>45){if(Math.abs(dx)>Math.abs(dy)){choose(scene+(dx<0?1:-1))}else{depth=clamp(depth+(dy<0?.48:-.48),-1.5,1.5);pulse=1.25;announce(dy<0?'EXPAND':'COMPRESS')}}else{point={x:e.clientX/w,y:e.clientY/h};pulse=1.5;energy=.9;announce('IMPULSE')}}
canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',()=>{down=null;holding=false;clearTimeout(holdTimer)});
window.addEventListener('keydown',e=>{if(!run)return;markInteraction();if(e.key==='ArrowRight')choose(scene+1);if(e.key==='ArrowLeft')choose(scene-1);if(e.key==='ArrowUp'||e.key==='ArrowDown'){depth+=e.key==='ArrowUp'?.4:-.4;pulse=1}if(e.key===' ')pulse=1.5});
document.addEventListener('visibilitychange',()=>{last=0});
function background(cx,cy,atmosphere){ctx.fillStyle='#020202';ctx.fillRect(0,0,w,h);const radius=Math.max(w,h)*.79;let g=ctx.createRadialGradient(cx,cy,.01,cx,cy,radius);g.addColorStop(0,atmosphere>0.5?'#171512':'#121518');g.addColorStop(.32,'#090909');g.addColorStop(1,'#010101');ctx.fillStyle=g;ctx.fillRect(0,0,w,h)}
function field(morph,dt){
const tw=w*.5+tilt.x*w*.065+drag.x*w*.14,th=h*.49+tilt.y*h*.065+drag.y*h*.09;
const spacing=Math.max(6.8,Math.min(10.5,w/44));const cols=Math.ceil(w/spacing)+10,rows=Math.ceil(h/spacing)+15;
const x0=(w-(cols-1)*spacing)/2,y0=(h-(rows-1)*spacing)/2;
const reach=Math.min(w,h)*.76,px=point.x*w,py=point.y*h;
for(let j=0;j<rows;j++){for(let i=0;i<cols;i++){
let bx=x0+i*spacing,by=y0+j*spacing;
const nx=(bx-tw)/reach,ny=(by-th)/reach;
const radial=Math.sqrt(nx*nx+ny*ny),a=Math.atan2(ny,nx);
const wave=Math.sin(radial*13.5-time*.83+Math.sin(a*2.4)*.85)*.5+.5;
const folded=Math.sin(nx*10+Math.cos(ny*6+time*.32)*2.6)+Math.cos(ny*9.3-nx*5.5-time*.19);
const mountain=Math.exp(-Math.pow((ny+.15*Math.sin(nx*5+time*.3)+nx*nx*.38)*2.1,2));
const hollow=Math.exp(-Math.pow((nx-.24*Math.sin(ny*4-time*.36))*.95,2)-Math.pow((ny+.08)*1.8,2));
const silver=clamp((.19+.34*folded+.65*mountain+.38*wave*.45)*(.72+.28*Math.cos(nx*2)),0,1);
const glow=clamp(.65*mountain+.72*hollow+.1*wave,0,1);
const dist=Math.hypot(bx-px,by-py),touch=Math.exp(-dist*dist/(w*w*.075));
const deformation=(folded*.26+mountain*1.7+hollow*.5)*morph;
const push=(holding?35:12*pulse)*touch;
let x=bx+nx*(deformation*18-push*.65)+Math.sin(ny*11+time*.28)*morph*4;
let y=by+ny*(deformation*29-push)+Math.cos(nx*9+time*.21)*morph*3;
const brightness=clamp((.1+.92*glow)*(1-morph)+silver*morph+touch*pulse*.27,0,1);
const alpha=clamp(.03+Math.pow(brightness,1.6)*(.88+energy*.1),.03,.98);
const size=(.68+2.35*brightness)*(1-morph*.22)+touch*pulse*.9;
ctx.fillStyle='rgba('+(morph>.55?'217,219,223':'229,222,211')+','+alpha.toFixed(3)+')';
ctx.beginPath();ctx.arc(x,y,size*.5,0,Math.PI*2);ctx.fill();
}}
}
function atmosphere(){
const cx=w*.47+tilt.x*38,cy=h*.41+tilt.y*47,spread=w*.98;
ctx.save();ctx.globalCompositeOperation='screen';
for(let k=0;k<5;k++){const xx=cx+Math.sin(time*.13+k*1.51)*w*.35,yy=cy+Math.cos(time*.11+k*.83)*h*.22;let r=spread*(.65+k*.10);let g=ctx.createRadialGradient(xx,yy,0,xx,yy,r);let op=(.10+.05*Math.sin(time*.25+k));g.addColorStop(0,'rgba(217,205,188,'+op+')');g.addColorStop(.38,'rgba(115,113,111,'+(op*.27)+')');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,w,h)}ctx.restore()}
function frame(now){raf=requestAnimationFrame(frame);let dt=Math.min(.045,(now-last||16)/1000);last=now;if(!run)return;time+=dt*(reduced?.25:1);sampleCamera(now);filteredLight=lerp(filteredLight,cameraActive?cameraLight:.5,Math.min(1,dt*2.3));form=lerp(form,scene,Math.min(1,dt*2));tilt.x=lerp(tilt.x,target.x,Math.min(1,dt*3));tilt.y=lerp(tilt.y,target.y,Math.min(1,dt*3));drag.x*=Math.exp(-dt*1.7);drag.y*=Math.exp(-dt*1.7);pulse*=Math.exp(-dt*2.9);energy=lerp(energy,holding?2.0:0,Math.min(1,dt*2.8));depth*=Math.exp(-dt*.42);
const idleElapsed=Math.max(0,performance.now()-lastTouch);
const idleProgress=clamp(idleElapsed/IDLE_FADE_MS,0,1);
const eased=idleProgress*idleProgress*(3-2*idleProgress);
// Fade out over 20 seconds. Wake back up smoothly at the first touch.
idleBlack=lerp(idleBlack,eased,Math.min(1,dt*(eased<idleBlack?5:30)));
$('ui').style.opacity=(1-idleBlack).toFixed(3);
$('camera').style.opacity=(1-idleBlack).toFixed(3);
$('lightmeter').style.opacity=(1-idleBlack).toFixed(3);
if($('motion').classList.contains('show'))$('motion').style.opacity=(1-idleBlack).toFixed(3);
const cx=w*.5+tilt.x*w*.07,cy=h*.48+tilt.y*h*.06;
background(cx,cy,form<.7);
// Dark, moderately defocused live camera texture with visible silhouettes below VOID materials.
// The same tiny local camera buffer drives the light meter; no image is stored or uploaded.
if(cameraActive&&cameraSamples>0){ctx.save();ctx.filter='blur(11px)';ctx.globalAlpha=.96;ctx.drawImage(cameraCanvas,-15,-15,w+30,h+30);ctx.restore();ctx.fillStyle='rgba(0,0,0,.37)';ctx.fillRect(0,0,w,h)}
if(form<1.15){ctx.save();ctx.globalAlpha=clamp(1-form*.6,0,1);atmosphere();ctx.restore()}
const opacity=clamp(.24+form*.56,0,1);
ctx.save();ctx.globalAlpha=opacity;field(clamp(form/2,0,1),dt);ctx.restore();
if(form>.5){ctx.save();ctx.globalAlpha=clamp((form-.5)*.20,0,.25);let g=ctx.createRadialGradient(cx,cy,30,cx,cy,w*.95);g.addColorStop(0,'#e0d9ce');g.addColorStop(1,'#000');ctx.globalCompositeOperation='screen';ctx.fillStyle=g;ctx.fillRect(0,0,w,h);ctx.restore()}
ctx.save();ctx.globalAlpha=.10+(scene===0?.12:.045);ctx.imageSmoothingEnabled=true;ctx.drawImage(noiseCanvas,0,0,w,h);ctx.restore();
let vignette=ctx.createRadialGradient(w/2,h/2,Math.min(w,h)*.2,w/2,h/2,Math.max(w,h)*.82);vignette.addColorStop(0,'rgba(0,0,0,0)');vignette.addColorStop(1,'rgba(0,0,0,.83)');ctx.fillStyle=vignette;ctx.fillRect(0,0,w,h);
// Camera modulates exposure in addition to the abstract live background; pixels remain local.
if(cameraActive&&cameraSamples>0){const normalized=clamp((filteredLight-.08)/.78,0,1);const delta=normalized-.5;if(delta>0){const strength=Math.pow(delta*2,1.25);const g=ctx.createRadialGradient(w*.5,h*.46,0,w*.5,h*.46,Math.max(w,h)*.78);g.addColorStop(0,'rgba(233,226,215,'+(strength*.48).toFixed(3)+')');g.addColorStop(.55,'rgba(171,166,158,'+(strength*.25).toFixed(3)+')');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,w,h)}else{ctx.fillStyle='rgba(0,0,0,'+(Math.pow(-delta*2,1.2)*.30).toFixed(3)+')';ctx.fillRect(0,0,w,h)}}
if(idleBlack>0.001){ctx.fillStyle='rgba(0,0,0,'+idleBlack.toFixed(4)+')';ctx.fillRect(0,0,w,h)}
}
})();
</script></body></html>
