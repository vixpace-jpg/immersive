<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta name="theme-color" content="#030508">
<title>VOID / Immersive Journey</title>
<style>
:root{color-scheme:dark;--cyan:#8cf8ff;--pink:#ff4f9d;--l:#e8f8ff}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#030508;color:var(--l);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none}button{font:inherit}#world{position:fixed;inset:0;width:100%;height:100%;display:block}#grain{position:fixed;inset:0;pointer-events:none;opacity:.2;background-image:url('data:image/svg+xml,%3Csvg viewBox="0 0 160 160" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="n"%3E%3CfeTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23n)" opacity=".2"/%3E%3C/svg%3E')}#intro{position:fixed;inset:0;display:grid;place-items:center;background:#020305;transition:opacity 1.1s ease,visibility 1.1s}#intro.off{opacity:0;visibility:hidden;pointer-events:none}.entrance{position:relative;border:0;background:transparent;color:#f2fdff;font-size:clamp(20px,5vw,34px);font-weight:300;letter-spacing:.4em;padding:30px 20px 30px 32px;cursor:pointer;text-shadow:0 0 25px #7deeff66;animation:breathe 3.6s ease-in-out infinite}.entrance:before,.entrance:after{content:'';position:absolute;inset:6px -14px;border-left:1px solid #8cf8ff88;border-right:1px solid #8cf8ff88;transform:scaleY(.35);transition:transform .3s}.entrance:hover:before,.entrance:focus-visible:before{transform:scaleY(1)}.entrance:after{inset:20px -28px;opacity:.3;transform:scaleY(.65)}@keyframes breathe{50%{opacity:.55;filter:blur(.5px)}}.subintro{position:absolute;bottom:calc(44px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#86969f;font-size:9px;letter-spacing:.25em}.hud{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 1.2s}.hud.show{opacity:1}.hud .top{position:absolute;top:calc(22px + env(safe-area-inset-top));left:22px;right:22px;display:flex;justify-content:space-between;gap:12px;font-size:10px;letter-spacing:.14em;color:#a3c2ca}.hud .left{position:absolute;left:22px;top:50%;writing-mode:vertical-rl;transform:rotate(180deg);font-size:9px;letter-spacing:.22em;color:#76929b}.hud .bottom{position:absolute;left:22px;right:22px;bottom:calc(25px + env(safe-area-inset-bottom));display:flex;align-items:end;justify-content:space-between;gap:10px}.hint{max-width:68%;font-size:10px;line-height:1.8;letter-spacing:.09em;color:#a7bbc2}.counter{font-size:12px;color:var(--cyan)}#message{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;opacity:0;transition:opacity .25s;width:85%;text-transform:uppercase;letter-spacing:.35em;font-size:12px;color:#ebfbff;text-shadow:0 0 18px var(--cyan)}#message.visible{opacity:1}#permissions{position:fixed;bottom:calc(95px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);border:1px solid #4e8a9c66;background:#07121bbd;color:#bcd9de;font-size:10px;padding:11px 14px;letter-spacing:.1em;display:none;z-index:3;white-space:nowrap}#permissions.show{display:block}#exit{pointer-events:auto;position:fixed;right:18px;top:calc(52px + env(safe-area-inset-top));border:0;background:none;color:#91a6af;font-size:10px;letter-spacing:.12em;opacity:0;cursor:pointer}#exit.show{opacity:1}@media (prefers-reduced-motion:reduce){.entrance{animation:none}#intro,.hud,#message{transition:none}}
</style></head>
<body><canvas id="world" aria-label="Ambiente immersivo interattivo"></canvas><div id="grain"></div>
<div id="intro"><button class="entrance" id="enter" aria-label="Entra nell'esperienza">ENTRA</button><div class="subintro">A SENSORY EXPERIMENT · 001</div></div>
<div class="hud" id="hud"><div class="top"><span>VOID / EXPERIMENT 001</span><span id="status">SYSTEM ONLINE</span></div><div class="left" id="mode">MODE / ORBIT</div><div class="bottom"><div class="hint" id="hint">TAP · HOLD · SWIPE ↑ ↓ ← → · TILT</div><div class="counter" id="count">01 / 05</div></div></div><div id="message" role="status" aria-live="polite"></div><button id="permissions">ATTIVA MOVIMENTO</button><button id="exit" aria-label="Torna all'ingresso">× ESC</button>
<script>
(()=>{'use strict';const canvas=document.getElementById('world'),ctx=canvas.getContext('2d',{alpha:false});const E=id=>document.getElementById(id);const intro=E('intro'),hud=E('hud'),msg=E('message'),hint=E('hint'),status=E('status'),mode=E('mode'),count=E('count'),perm=E('permissions'),exit=E('exit');const names=['ORBIT','FRACTURE','PULSE','TUNNEL','SINGULARITY'];let running=false,scene=0,t=0,W=0,H=0,DPR=1,stars=[],rings=[],tilt={x:0,y:0},targetTilt={x:0,y:0},pointer={x:0,y:0,down:false},energy=0,flash=0,shift=0,reverse=false,hold=false,pressTimer=0,pressStart=null,raf=0,toastTimer=0,last=0;let gyroAttached=false;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);ctx.setTransform(DPR,0,0,DPR,0,0);stars=Array.from({length:Math.min(290,Math.floor(W*H/900))},()=>({x:Math.random()*2-1,y:Math.random()*2-1,z:Math.random()*.95+.05,s:Math.random()*1.4+.3,h:Math.random()}));rings=Array.from({length:22},(_,i)=>({z:i/22}));}addEventListener('resize',resize,{passive:true});resize();
function toast(s){msg.textContent=s;msg.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>msg.classList.remove('visible'),850)}function setScene(n){scene=(n+names.length)%names.length;mode.textContent='MODE / '+names[scene];count.textContent=String(scene+1).padStart(2,'0')+' / 05';flash=.7;toast(names[scene]);}function tap(x,y){pointer.x=(x/W-.5)*2;pointer.y=(y/H-.5)*2;energy=Math.min(2.5,energy+.75);flash=.25;toast('SIGNAL RECEIVED');}function longStart(){hold=true;energy=2;toast('CHARGE / HOLD');}function longEnd(){if(hold){hold=false;energy=Math.max(energy,1);toast('RELEASE');}}function gesture(dx,dy){if(Math.abs(dx)>Math.abs(dy)){reverse=dx<0;setScene(scene+(dx<0?1:-1));}else{shift+=dy<0?1:-1;flash=.95;energy=1.7;toast(dy<0?'ASCEND':'DESCEND');}}
function gyroscope(e){if(e.gamma==null||e.beta==null)return;targetTilt.x=Math.max(-1,Math.min(1,e.gamma/35));targetTilt.y=Math.max(-1,Math.min(1,(e.beta-45)/50));status.textContent='MOTION ACTIVE';}async function enableGyro(){if(gyroAttached)return;try{if(typeof DeviceOrientationEvent==='undefined'){status.textContent='MOTION UNAVAILABLE';return;}if(typeof DeviceOrientationEvent.requestPermission==='function'){const r=await DeviceOrientationEvent.requestPermission();if(r!=='granted'){status.textContent='MOTION DENIED';return;}}addEventListener('deviceorientation',gyroscope,{passive:true});gyroAttached=true;perm.classList.remove('show');status.textContent='MOTION READY';}catch{status.textContent='MOTION UNAVAILABLE';}}function shouldOfferMotion(){return typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function';}
function fullscreen(){const el=document.documentElement;try{if(el.requestFullscreen)Promise.resolve(el.requestFullscreen({navigationUI:'hide'})).catch(()=>{});}catch{}}
function start(){running=true;intro.classList.add('off');hud.classList.add('show');exit.classList.add('show');fullscreen();if(shouldOfferMotion())perm.classList.add('show');else enableGyro();setScene(0);if(!raf)raf=requestAnimationFrame(draw);}function stop(){running=false;intro.classList.remove('off');hud.classList.remove('show');exit.classList.remove('show');perm.classList.remove('show');try{if(document.fullscreenElement)document.exitFullscreen();}catch{} }E('enter').addEventListener('click',start);exit.addEventListener('click',stop);perm.addEventListener('click',enableGyro);
canvas.addEventListener('pointerdown',e=>{if(!running)return;pointer.down=true;pressStart={x:e.clientX,y:e.clientY,time:performance.now()};pointer.x=(e.clientX/W-.5)*2;pointer.y=(e.clientY/H-.5)*2;clearTimeout(pressTimer);pressTimer=setTimeout(longStart,480);try{canvas.setPointerCapture(e.pointerId)}catch{};});canvas.addEventListener('pointermove',e=>{if(!running)return;if(pointer.down){pointer.x=(e.clientX/W-.5)*2;pointer.y=(e.clientY/H-.5)*2;if(pressStart&&Math.hypot(e.clientX-pressStart.x,e.clientY-pressStart.y)>22){clearTimeout(pressTimer);if(hold)longEnd();}}});function release(e){if(!pointer.down||!running)return;pointer.down=false;clearTimeout(pressTimer);const start=pressStart;pressStart=null;if(!start)return;const dx=e.clientX-start.x,dy=e.clientY-start.y;if(hold){longEnd();return;}if(Math.hypot(dx,dy)>50)gesture(dx,dy);else tap(e.clientX,e.clientY);}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',()=>{clearTimeout(pressTimer);pointer.down=false;pressStart=null;longEnd();});addEventListener('keydown',e=>{if(!running)return;if(e.key==='Escape')stop();else if(e.key==='ArrowRight'||e.key==='ArrowLeft')gesture(e.key==='ArrowRight'?100:-100,0);else if(e.key==='ArrowUp'||e.key==='ArrowDown')gesture(0,e.key==='ArrowUp'?-100:100);else if(e.key===' ')tap(W/2,H/2);});
function draw(now){raf=requestAnimationFrame(draw);const dt=Math.min(.04,(now-last||16)/1000);last=now;if(!running){ctx.fillStyle='#020305';ctx.fillRect(0,0,W,H);return;}t+=dt*(reduced?.3:1);energy+=(hold?2.2:0-energy)*Math.min(1,dt*2);flash=Math.max(0,flash-dt*1.5);tilt.x+=(targetTilt.x-tilt.x)*Math.min(1,dt*3.5);tilt.y+=(targetTilt.y-tilt.y)*Math.min(1,dt*3.5);const cx=W/2+tilt.x*W*.105+pointer.x*W*.035,cy=H/2+tilt.y*H*.09+pointer.y*H*.035,R=Math.min(W,H),tone=scene===1?320:scene===3?185:scene===4?300:190;ctx.fillStyle='#030508';ctx.fillRect(0,0,W,H);let bg=ctx.createRadialGradient(cx,cy,1,cx,cy,R*.85);bg.addColorStop(0,scene===4?'#18061d':'#061920');bg.addColorStop(.45,'#040a10');bg.addColorStop(1,'#030508');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);ctx.save();ctx.translate(cx,cy);
const speed=scene===3?2.2:scene===2?.55:1;for(let i=0;i<stars.length;i++){const s=stars[i],z=((s.z-t*.033*speed*(reverse?-1:1))%1+1)%1+.04;let angle=Math.atan2(s.y,s.x)+t*(scene===1?.13:.035)*(i%2?-1:1),rad=Math.hypot(s.x,s.y);let d=(.12+1.6*(1-z)**2)*R;const x=Math.cos(angle)*rad*d,y=Math.sin(angle)*rad*d*1.55;const alpha=Math.max(.07,1-z)*(.4+energy*.16);ctx.fillStyle='hsla('+ (tone+s.h*50) +',95%,'+(scene===1?70:82)+'%,'+alpha+')';ctx.fillRect(x,y,s.s*(1-z)*2,s.s*(1-z)*2);}
for(let j=0;j<rings.length;j++){const zz=((rings[j].z+t*.08*speed*(reverse?-1:1))%1+1)%1;const scale=.12+Math.pow(zz,1.7)*2.9;const r=R*.11*scale;ctx.beginPath();ctx.ellipse(0,0,r,r*(scene===1?.72:1.26),scene===1?t*.11+j*.35:0,0,Math.PI*2);ctx.strokeStyle='hsla('+(tone+(scene===1?85:0))+',100%,'+(65+zz*20)+'%,'+((.02+zz*.20)*(1+energy*.12))+')';ctx.lineWidth=.5+zz*.9;ctx.stroke();}
const core=R*(scene===4?.07:.028)*(1+Math.sin(t*2)*.13+energy*.35);const g=ctx.createRadialGradient(0,0,0,0,0,core*8);g.addColorStop(0,'rgba(235,251,255,'+(.7+Math.min(.3,energy*.1))+')');g.addColorStop(.07,'hsla('+tone+',100%,75%,.7)');g.addColorStop(.25,'hsla('+tone+',100%,58%,.12)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,core*8,0,Math.PI*2);ctx.fill();ctx.strokeStyle='hsla('+tone+',100%,80%,.5)';ctx.lineWidth=.9;ctx.beginPath();ctx.arc(0,0,R*(.13+Math.sin(t*.9)*.004+energy*.018),0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(-R*.38,0);ctx.lineTo(-R*.18,0);ctx.moveTo(R*.18,0);ctx.lineTo(R*.38,0);ctx.moveTo(0,-R*.4);ctx.lineTo(0,-R*.2);ctx.moveTo(0,R*.2);ctx.lineTo(0,R*.4);ctx.strokeStyle='hsla('+tone+',100%,80%,.14)';ctx.stroke();if(scene===2){for(let i=0;i<5;i++){const rad=R*(.12+i*.085+(t*.15)% .085);ctx.beginPath();ctx.arc(0,0,rad,0,Math.PI*2);ctx.strokeStyle='hsla('+tone+',100%,75%,'+(.2/(i+1)+energy*.04)+')';ctx.stroke();}}
if(scene===1){ctx.rotate(t*.13);for(let i=0;i<8;i++){ctx.rotate(Math.PI/4);ctx.beginPath();ctx.moveTo(R*.12,0);ctx.lineTo(R*(.25+i%3*.08),0);ctx.strokeStyle='rgba(255,82,154,'+(.1+energy*.06)+')';ctx.stroke();}}ctx.restore();if(flash>0){ctx.fillStyle='rgba(135,242,255,'+(flash*.035)+')';ctx.fillRect(0,0,W,H);}const gridAlpha=.06;ctx.strokeStyle='rgba(141,230,240,'+gridAlpha+')';ctx.lineWidth=.5;const m=18;ctx.strokeRect(m,m,W-2*m,H-2*m);ctx.beginPath();ctx.moveTo(m+8,m+8);ctx.lineTo(m+30,m+8);ctx.moveTo(W-m-30,H-m-8);ctx.lineTo(W-m-8,H-m-8);ctx.stroke();}
raf=requestAnimationFrame(draw);
})();
</script></body></html>
